<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | HeritageEdge</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="login">
    <form method="post" class="panel login-card">
      <img class="login-logo" src="{{ url_for('static', filename='img/heritage-logo.png') }}" alt="Heritage Foods">
      <h1>HeritageEdge</h1>
      <p class="sub">Log in with your email and password.</p>
      {% if notice %}<p class="notice-text" role="status">{{ notice }}</p>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="text" autocomplete="username" value="{{ email }}" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="text" autocomplete="current-password" required>
      {% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
      <button type="submit" class="btn btn-primary">Log in</button>
      <a class="login-link" href="/forgot">Forgot your password?</a>
    </form>
  </main>
</body>
</html>
