<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | HeritageEdge</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="login">
    <form method="post" class="panel login-card">
      <img class="login-logo" src="{{ url_for('static', filename='img/heritage-logo.png') }}" alt="Heritage Foods">
      <h1>HeritageEdge</h1>
      <p class="sub">Enter the team password to continue.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="text" autocomplete="current-password" autofocus required>
      {% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </main>
</body>
</html>
