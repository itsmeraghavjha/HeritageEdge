{% extends "auth_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block card %}
<h1>{{ title }}</h1>
<p class="auth-sub">{{ text }}</p>
{% if link %}<a class="auth-btn auth-btn-link" href="{{ link[0] }}">{{ link[1] }}</a>{% endif %}
<p class="auth-alt"><a href="/login">Back to log in</a></p>
{% endblock %}
