<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HeritageEdge{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="/">
      <img class="brand-logo" src="{{ url_for('static', filename='img/heritage-logo.png') }}" alt="Heritage Foods">
      <span class="brand-text"><strong>HeritageEdge</strong><small>MRF studio</small></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/" class="{{ 'is-active' if active == 'simulator' }}">Promo simulator</a>
      <a href="/pnl" class="{{ 'is-active' if active == 'pnl' }}">P&amp;L statement</a>
    </nav>
    <p class="side-note">Sample data, monthly run-rate. Replace the loader in <code>engine/data.py</code> with actuals.</p>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
