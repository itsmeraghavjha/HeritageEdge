{% extends "auth_base.html" %}
{% block title %}Set password{% endblock %}
{% block card %}
<h1>Set your password</h1>
<p class="auth-sub">For <strong>{{ email }}</strong>. Use at least {{ min_length }} characters, with letters and numbers.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="field">
    <label for="password">New password</label>
    <div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" minlength="{{ min_length }}" autofocus required><button type="button" class="reveal" data-reveal aria-pressed="false">Show</button></div>
  </div>
  <div class="field">
    <label for="again">Type it again</label>
    <div class="pw"><input id="again" name="again" type="password" autocomplete="new-password" required></div>
  </div>
  {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
  <button type="submit" class="auth-btn" data-busy="Saving">Save password</button>
</form>
{% endblock %}
