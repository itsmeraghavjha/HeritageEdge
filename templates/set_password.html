<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set password | HeritageEdge</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="login">
    <form method="post" class="panel login-card">
      <img class="login-logo" src="{{ url_for('static', filename='img/heritage-logo.png') }}" alt="Heritage Foods">
      <h1>Set your password</h1>
      <p class="sub">For {{ email }}. Use at least {{ min_length }} characters with letters and numbers.</p>
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" class="text" autocomplete="new-password" minlength="{{ min_length }}" autofocus required>
      <label for="again">Type it again</label>
      <input id="again" name="again" type="password" class="text" autocomplete="new-password" required>
      {% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
      <button type="submit" class="btn btn-primary">Save password</button>
    </form>
  </main>
</body>
</html>
