<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | HeritageEdge</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="login">
    <form method="post" class="panel login-card">
      <img class="login-logo" src="{{ url_for('static', filename='img/heritage-logo.png') }}" alt="Heritage Foods">
      <h1>Forgot your password?</h1>
      {% if sent %}
      <p class="notice-text" role="status">If that email has an account, a link to set a new password is on its way. It works once and expires in 2 hours.</p>
      <a class="login-link" href="/login">Back to log in</a>
      {% else %}
      <p class="sub">Enter your email and we will send you a link to set a new password.</p>
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="text" autocomplete="username" autofocus required>
      <button type="submit" class="btn btn-primary">Send link</button>
      <a class="login-link" href="/login">Back to log in</a>
      {% endif %}
    </form>
  </main>
</body>
</html>
